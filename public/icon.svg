<svg
  width="256"
  height="256"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="swGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .sw-node { fill: #0f172a; }
      @media (prefers-color-scheme: light) {
        .sw-node { fill: #ffffff; }
      }
    </style>
  </defs>

  <!-- Top node -->
  <circle
    class="sw-node"
    cx="96"
    cy="18"
    r="6"
    stroke="url(#swGradient)"
    stroke-width="4"
    filter="url(#glow)"
  />

  <!-- Bottom node -->
  <circle
    class="sw-node"
    cx="20"
    cy="92"
    r="6"
    stroke="url(#swGradient)"
    stroke-width="4"
    filter="url(#glow)"
  />

  <!-- Main curves -->
  <path
    d="M90 18 C60 -2, 20 8, 20 44 C20 54, 28 60, 38 60 L52 60"
    stroke="url(#swGradient)"
    stroke-width="10"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- W -->
  <path
    d="M62 46 L74 78 L92 36"
    stroke="url(#swGradient)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Bottom loop -->
  <path
    d="M92 44 L92 70 C92 92, 74 104, 52 104 C34 104, 20 100, 20 92"
    stroke="url(#swGradient)"
    stroke-width="10"
    stroke-linecap="round"
    filter="url(#glow)"
  />
</svg>
