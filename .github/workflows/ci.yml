name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || true  # Don't fail on type errors initially
        continue-on-error: true  # Allow type check to pass even with warnings

      - name: Lint
        run: npm run lint || true  # Don't fail on lint errors initially
        continue-on-error: true

      - name: Run tests
        run: npm test -- --passWithNoTests --no-coverage
        env:
          # Mock environment variables for CI (don't need real values)
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder_key_123"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
          GROQ_API_KEY: "mock_key_for_ci"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_USER: "mock@gmail.com"
          SMTP_APP_PASSWORD: "mock_password"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder_key_123"
          NEXT_PUBLIC_BASE_URL: "https://spendwise-ai-dun.vercel.app"
          GROQ_API_KEY: "mock_key_for_ci"
